<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Manutenção</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Sistema de Manutenção</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${titulo}">Solicitações de Manutenção</h1>
        <div>
          <a
            class="btn btn-outline-primary me-2"
            th:href="@{/solicitacoes/pendentes}"
            >Pendentes</a
          >
          <a class="btn btn-outline-secondary me-2" th:href="@{/solicitacoes}"
            >Todas</a
          >
          <a class="btn btn-success" th:href="@{/solicitacoes/nova}"
            >Nova Solicitação</a
          >
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>Solicitante</th>
              <th>Item</th>
              <th>Local/Setor</th>
              <th>Descrição</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Data Solicitação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="solicitacao : ${solicitacoes}">
              <td th:text="${solicitacao.solicitante}"></td>
              <td th:text="${solicitacao.item}"></td>
              <td th:text="${solicitacao.localSetor}"></td>
              <td th:text="${solicitacao.descricaoProblema}"></td>
              <td>
                <span
                  th:if="${solicitacao.prioridade == 'URGENTE'}"
                  class="badge bg-danger"
                  th:text="${solicitacao.prioridade}"
                ></span>
                <span
                  th:if="${solicitacao.prioridade == 'ALTA'}"
                  class="badge bg-warning"
                  th:text="${solicitacao.prioridade}"
                ></span>
                <span
                  th:if="${solicitacao.prioridade == 'MEDIA'}"
                  class="badge bg-info"
                  th:text="${solicitacao.prioridade}"
                ></span>
                <span
                  th:if="${solicitacao.prioridade == 'BAIXA'}"
                  class="badge bg-secondary"
                  th:text="${solicitacao.prioridade}"
                ></span>
              </td>
              <td>
                <span
                  th:if="${solicitacao.status == 'ABERTA'}"
                  class="badge bg-primary"
                  th:text="${solicitacao.status}"
                ></span>
                <span
                  th:if="${solicitacao.status == 'EM_ANDAMENTO'}"
                  class="badge bg-warning"
                  th:text="${solicitacao.status}"
                ></span>
                <span
                  th:if="${solicitacao.status == 'CONCLUIDA'}"
                  class="badge bg-success"
                  th:text="${solicitacao.status}"
                ></span>
                <span
                  th:if="${solicitacao.status == 'CANCELADA'}"
                  class="badge bg-secondary"
                  th:text="${solicitacao.status}"
                ></span>
              </td>
              <td
                th:text="${#temporals.format(solicitacao.dataSolicitacao, 'dd/MM/yyyy HH:mm')}"
              ></td>
              <td>
                <a
                  class="btn btn-sm btn-outline-warning"
                  th:href="@{/solicitacoes/editar/{id}(id=${solicitacao.id})}"
                  >Editar</a
                >
                <a
                  class="btn btn-sm btn-outline-info"
                  th:href="@{/solicitacoes/status/{id}(id=${solicitacao.id})}"
                  >Status</a
                >
                <a
                  class="btn btn-sm btn-outline-danger"
                  th:href="@{/solicitacoes/excluir/{id}(id=${solicitacao.id})}"
                  >Excluir</a
                >
              </td>
            </tr>
          </tbody>
        </table>

        <div
          th:if="${#lists.isEmpty(solicitacoes)}"
          class="text-center text-muted py-5"
        >
          <p>Nenhuma solicitação encontrada</p>
          <p>Clique em "Nova Solicitação" para criar a primeira solicitação</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
