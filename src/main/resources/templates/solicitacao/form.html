<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${solicitacao.id == null} ? 'Nova Solicitação' : 'Editar Solicitação'"
    >
      Formulário
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Sistema de Manutenção</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-header">
              <h2
                th:text="${solicitacao.id == null} ? 'Nova Solicitação de Manutenção' : 'Editar Solicitação'"
              ></h2>
            </div>
            <div class="card-body">
              <form
                th:action="${solicitacao.id == null} ? @{/solicitacoes/nova} : @{/solicitacoes/editar/{id}(id=${solicitacao.id})}"
                th:object="${solicitacao}"
                method="post"
              >
                <div class="mb-3">
                  <label for="solicitante" class="form-label"
                    >Solicitante *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="solicitante"
                    th:field="*{solicitante}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('solicitante')}"
                    th:errors="*{solicitante}"
                  ></div>
                </div>

                <div class="mb-3">
                  <label for="item" class="form-label">Item *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="item"
                    th:field="*{item}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('item')}"
                    th:errors="*{item}"
                  ></div>
                </div>

                <div class="mb-3">
                  <label for="localSetor" class="form-label"
                    >Local/Setor *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="localSetor"
                    th:field="*{localSetor}"
                    required
                  />
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('localSetor')}"
                    th:errors="*{localSetor}"
                  ></div>
                </div>

                <div class="mb-3">
                  <label for="descricaoProblema" class="form-label"
                    >Descrição do Problema *</label
                  >
                  <textarea
                    class="form-control"
                    id="descricaoProblema"
                    th:field="*{descricaoProblema}"
                    rows="4"
                    required
                  ></textarea>
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('descricaoProblema')}"
                    th:errors="*{descricaoProblema}"
                  ></div>
                </div>

                <div class="mb-3">
                  <label for="prioridade" class="form-label"
                    >Prioridade *</label
                  >
                  <select
                    class="form-select"
                    id="prioridade"
                    th:field="*{prioridade}"
                    required
                  >
                    <option value="">Selecione a prioridade</option>
                    <option value="BAIXA">BAIXA</option>
                    <option value="MEDIA">MEDIA</option>
                    <option value="ALTA">ALTA</option>
                    <option value="URGENTE">URGENTE</option>
                  </select>
                  <div
                    class="text-danger"
                    th:if="${#fields.hasErrors('prioridade')}"
                    th:errors="*{prioridade}"
                  ></div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button type="submit" class="btn btn-primary">Salvar</button>
                  <a th:href="@{/solicitacoes}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
