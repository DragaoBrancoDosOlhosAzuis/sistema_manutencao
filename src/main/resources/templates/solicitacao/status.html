<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alterar Status</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Sistema de Manutenção</a>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">
              <h2>Alterar Status da Solicitação</h2>
            </div>
            <div class="card-body">
              <div class="mb-3">
                <strong>Solicitante:</strong>
                <span th:text="${solicitacao.solicitante}"></span>
              </div>
              <div class="mb-3">
                <strong>Item:</strong>
                <span th:text="${solicitacao.item}"></span>
              </div>
              <div class="mb-3">
                <strong>Status Atual:</strong>
                <span th:text="${solicitacao.status}"></span>
              </div>

              <form
                th:action="@{/solicitacoes/status/{id}(id=${solicitacao.id})}"
                method="post"
              >
                <div class="mb-3">
                  <label for="status" class="form-label">Novo Status *</label>
                  <select
                    class="form-select"
                    id="status"
                    name="status"
                    required
                  >
                    <option value="ABERTA">ABERTA</option>
                    <option value="EM_ANDAMENTO">EM_ANDAMENTO</option>
                    <option value="CONCLUIDA">CONCLUIDA</option>
                    <option value="CANCELADA">CANCELADA</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="observacoesConclusao" class="form-label"
                    >Observações</label
                  >
                  <textarea
                    class="form-control"
                    id="observacoesConclusao"
                    name="observacoesConclusao"
                    rows="3"
                  ></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                  <button type="submit" class="btn btn-primary">
                    Atualizar Status
                  </button>
                  <a th:href="@{/solicitacoes}" class="btn btn-secondary"
                    >Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
