services:
  - type: web
    name: sistema-manutencao
    env: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/sistema-manutencao-1.0.0.jar"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_VERSION
        value: 17
    healthCheckPath: /